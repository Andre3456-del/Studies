name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build the app
        working-directory: android
        run: gradle assembleRelease -PverCode=${{ github.run_number }} --no-daemon
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk StudiesHub.apk
      - uses: actions/upload-artifact@v4
        with: { name: StudiesHub-app, path: StudiesHub.apk }
      - name: Publish a download link
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES="Download StudiesHub.apk on your Android phone and open it to install. versionCode: ${{ github.run_number }}"
          if gh release view app-latest >/dev/null 2>&1; then
            gh release upload app-latest StudiesHub.apk --clobber
            gh release edit app-latest --notes "$NOTES"
          else
            gh release create app-latest StudiesHub.apk --title "Studies Hub app (Android)" --notes "$NOTES"
          fi
