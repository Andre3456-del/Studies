name: Calling syntax check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/livekit-voice-video-calls]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check server.js
      - run: node --check calling.js
      - run: node -e "require('./calling')"
