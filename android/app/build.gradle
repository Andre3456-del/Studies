plugins { id 'com.android.application' }

android {
    namespace 'org.studieshub.app'
    compileSdk 34
    defaultConfig {
        applicationId 'org.studieshub.app'
        minSdk 24
        targetSdk 34
        versionCode (project.findProperty('verCode') ?: '1').toInteger()
        versionName '1.0.' + (project.findProperty('verCode') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file('../studieshub.keystore')
            storePassword 'studieshub-app'
            keyAlias 'studieshub'
            keyPassword 'studieshub-app'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
