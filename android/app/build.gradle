plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def vc = (project.hasProperty('verCode') ? project.property('verCode') : '1').toString().toInteger()

android {
    namespace 'org.studieshub.app'
    compileSdk 34
    defaultConfig {
        applicationId 'org.studieshub.app'
        minSdk 24
        targetSdk 34
        versionCode = vc
        versionName = '1.0.' + vc
    }
    signingConfigs {
        release {
            storeFile file('../studieshub.keystore')
            storePassword 'studieshub-app'
            keyAlias 'studieshub'
            keyPassword 'studieshub-app'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
