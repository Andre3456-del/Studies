plugins { id 'com.android.application' }

def vc = (project.hasProperty('verCode') ? project.property('verCode') : '1').toString().toInteger()

android {
    namespace 'org.studieshub.app'
    compileSdk 34
    defaultConfig {
        applicationId 'org.studieshub.app'
        minSdk 24
        targetSdk 34
        versionCode = vc
        versionName = '1.0.' + vc
    }
    signingConfigs {
        release {
            storeFile file('../studieshub.keystore')
            storePassword 'studieshub-app'
            keyAlias 'studieshub'
            keyPassword 'studieshub-app'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
